name: CI failure diagnostics

on:
  push:
    branches: [main]
    paths: ['.github/workflows/ci-diagnostics.yml']
  workflow_dispatch:
    inputs:
      run_id:
        description: 'CI run to diagnose (empty selects the latest ci run on main)'
        required: false
        type: string

permissions:
  actions: read
  contents: read

jobs:
  failed-job-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read failed job logs and publish bounded excerpts
        uses: actions/github-script@v7
        with:
          script: |
            const repo = context.repo;
            let runId = context.payload.inputs?.run_id;
            if (!runId) {
              const runs = await github.rest.actions.listWorkflowRuns({
                ...repo, workflow_id: 'main.yml', branch: 'main', per_page: 1
              });
              runId = runs.data.workflow_runs[0]?.id;
            }
            if (!runId || !/^\d+$/.test(String(runId))) {
              throw new Error('A CI run id is required');
            }
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              ...repo, run_id: Number(runId), per_page: 100
            });
            const wanted = new Set(['DBMS Tests (Citus)', 'DBMS Tests (Hive)', 'DBMS Tests (Spark)',
              'DBMS Tests (MySQL, CERT creation only)', 'DBMS Tests (Presto)', 'QPG Tests (Materialize)']);
            core.notice(jobs.filter(job => wanted.has(job.name)).map(job => `${job.name}: ${job.status}/${job.conclusion ?? 'pending'}`).join('\n'), {title: `CI run ${runId}: six-job status`});
            for (const job of jobs.filter(job => wanted.has(job.name) && job.conclusion === 'success')) {
              const reply = await github.rest.actions.downloadJobLogsForWorkflowRun({...repo, job_id: job.id});
              const body = typeof reply.data === 'string' ? reply.data : Buffer.from(reply.data).toString('utf8');
              const sections = body.split(/(?=\[INFO\] Running sqlancer\.)/).slice(1);
              const tests = sections.map(section => {
                const name = section.match(/Running (sqlancer\.[\w.]+)/)?.[1];
                const result = section.match(/Tests run: (\d+), Failures: (\d+), Errors: (\d+), Skipped: (\d+)/);
                const queries = [...section.matchAll(/Executed (\d+) queries/g)].map(match => Number(match[1]));
                return {name, result: result?.slice(1).map(Number), max_progress_queries: queries.length ? Math.max(...queries) : null};
              });
              core.notice(JSON.stringify({job: job.name, url: job.html_url, tests}), {title: `${job.name}: successful tests and progress`});
            }
            const failed = jobs.filter(job => wanted.has(job.name) && ['failure', 'cancelled', 'timed_out'].includes(job.conclusion));
            core.summary.addHeading(`Failure evidence for CI run ${runId}`);
            for (const job of failed) {
              const reply = await github.rest.actions.downloadJobLogsForWorkflowRun({...repo, job_id: job.id});
              const body = typeof reply.data === 'string' ? reply.data : Buffer.from(reply.data).toString('utf8');
              const lines = body.replace(/\u001b\[[0-9;]*m/g, '').split('\n');
              const hits = lines.map((line, i) => !/\[WARNING\]|PKIX|maven.java.net/.test(line) &&
                /Caused by:|(?:java|org|io|com)\.[\w.$]*(?:Exception|Error):|Unable to locate|404 |does not have a Release|^E:|FATAL:|ERROR:/.test(line) ? i : -1).filter(i => i >= 0);
              const selected = new Set();
              for (const i of hits.slice(0, 5)) {
                for (let j = Math.max(0, i - 4); j < Math.min(lines.length, i + 7); j++) selected.add(j);
              }
              if (!selected.size) for (let i = Math.max(0, lines.length - 35); i < lines.length; i++) selected.add(i);
              const excerpt = [...selected].sort((a, b) => a - b).map(i => `${i + 1}: ${lines[i].slice(0, 600)}`).join('\n').slice(0, 6000);
              const escaped = excerpt.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
              core.summary.addDetails(`${job.name} (${job.conclusion})`, `<p>${job.html_url}</p><pre>${escaped}</pre>`);
              core.notice(excerpt, {title: `${job.name}: failure evidence`});
              if (job.name.includes('MySQL') || job.name.includes('Presto')) {
                const first = hits[0] ?? 0;
                const sql = lines.slice(first, first + 1200)
                  .filter(line => !/\[WARNING\]|PKIX|\tat |at java\./.test(line) &&
                    /--|SELECT|INSERT|CREATE|SET |Caused by:|Exception:|optimized:|unoptimized:|count:|mismatch/i.test(line))
                  .join('\n').slice(0, 24000);
                const oracle = lines.slice(first).filter(line => !/\[WARNING\]|PKIX|\tat |at java\./.test(line) &&
                  /-- On the database|-- optimized:|-- unoptimized:|-- original:|-- transformed:|-- SELECT|-- Query:|-- cardinality:|-- count:|Caused by:|Exception:/.test(line));
                core.notice(oracle.length ? oracle.map(line => line.slice(0, 1000)).join('\n').slice(0, 3800) : sql, {title: `${job.name}: SQL and causes`});
                if (job.name.includes('MySQL')) {
                  const crash = lines.filter(line => /mysqld|signal|assertion|Query \(|Query:|killed|out of memory|ERROR|DQE|DELETE FROM|UPDATE.*updated|TRUNCATE|ALTER TABLE|t0.rowid|rows|query error/i.test(line) && !/Downloading|Downloaded|WARNING|PKIX|\tat /.test(line));
                  core.notice(crash.slice(-26).map(line => line.slice(0, 350)).join('\n').slice(-3800), {title: 'MySQL final SQL and server diagnostics'});
                }
              }
            }
            core.summary.addRaw(`Inspected ${jobs.length} jobs; ${failed.length} did not succeed.\n`);
            await core.summary.write();
